const calculators=[{"name": "Lydens hastighed", "formula": "C = 331 + ⌊0,6 × T⌋", "fields": [{"k": "t", "label": "Temperatur", "value": 20, "unit": "°C"}], "calc": "{C:331+Math.floor(.6*v.t)}", "note": ""}, {"name": "Delay tid", "formula": "Delay = (Afstand / Hastighed) × 1000", "fields": [{"k": "d", "label": "Afstand", "value": 10, "unit": "m"}, {"k": "c", "label": "Hastighed", "value": 343, "unit": "m/s"}], "calc": "{Delay:v.d/v.c*1000}", "note": "Delay i ms."}, {"name": "Lydtryksforskel", "formula": "dB = 20 × log₁₀(D₁ / D₂)", "fields": [{"k": "a", "label": "D₁ – Afstand 1", "value": 3, "unit": "m"}, {"k": "b", "label": "D₂ – Afstand 2", "value": 28, "unit": "m"}], "calc": "{dB:20*Math.log10(v.a/v.b)}", "note": "Vælg 10 × log eller 20 × log. Begge bruger logaritmen med grundtal 10."}, {"name": "Kritisk afstand", "formula": "V = L × B × H   |   AN = (0,16 × V) / 3,5   |   D = 0,14 × √(Q × AN)", "fields": [{"k": "l", "label": "Længde", "value": 10, "unit": "m"}, {"k": "b", "label": "Bredde", "value": 8, "unit": "m"}, {"k": "h", "label": "Højde", "value": 3, "unit": "m"}, {"k": "q", "label": "Q", "value": 2, "unit": ""}], "calc": "{\"Rumfang (m³)\":v.l*v.b*v.h,\"AN\":.16*(v.l*v.b*v.h)/3.5,\"Kritisk afstand (m)\":.14*Math.sqrt(v.q*(.16*(v.l*v.b*v.h)/3.5))}", "note": "Indtast længde, bredde, højde og Q. Rumfang og AN beregnes automatisk og bruges til kritisk afstand."}, {"name": "Frekvens", "formula": "f = C / λ", "fields": [{"k": "c", "label": "Lydhastighed", "value": 343, "unit": "m/s"}, {"k": "w", "label": "Bølgelængde", "value": 4.9, "unit": "m"}], "calc": "{Hz:v.c/v.w}", "note": ""}, {"name": "Bølgelængde", "formula": "λ = C / f", "fields": [{"k": "c", "label": "Lydhastighed", "value": 343, "unit": "m/s"}, {"k": "hz", "label": "Frekvens", "value": 70, "unit": "Hz"}], "calc": "{Meter:v.c/v.hz}", "note": ""}, {"name": "Koblingsregel", "formula": "D = (L² × f) / (2 × C)", "fields": [{"k": "l", "label": "L", "value": 2, "unit": "m"}, {"k": "hz", "label": "Frekvens", "value": 100, "unit": "Hz"}, {"k": "c", "label": "C", "value": 343, "unit": "m/s"}], "calc": "{D:v.l*v.l*v.hz/(2*v.c)}", "note": ""}, {"name": "Bagvægsudfasning", "formula": "D = C / (4 × M)", "fields": [{"k": "c", "label": "C", "value": 343, "unit": "m/s"}, {"k": "m", "label": "M", "value": 80, "unit": ""}], "calc": "{D:v.c/(4*v.m)}", "note": "M er bevaret som i den indsendte formel."}, {"name": "Periodetid", "formula": "T = (1 / f) × 1000", "fields": [{"k": "hz", "label": "Frekvens", "value": 100, "unit": "Hz"}], "calc": "{ms:1000/v.hz}", "note": ""}, {"name": "Frekvens fra periodetid", "formula": "f = (1 / T) × 1000", "fields": [{"k": "t", "label": "Periodetid", "value": 10, "unit": "ms"}], "calc": "{Hz:1000/v.t}", "note": ""}, {"name": "Stående bølger", "formula": "f = (C / 2) × √((n/L)² + (n/B)² + (n/H)²)", "fields": [{"k": "c", "label": "C", "value": 343, "unit": "m/s"}, {"k": "n", "label": "n", "value": 1, "unit": ""}, {"k": "l", "label": "Længde", "value": 5, "unit": "m"}, {"k": "b", "label": "Bredde", "value": 4, "unit": "m"}, {"k": "h", "label": "Højde", "value": 3, "unit": "m"}], "calc": "{Hz:v.c/2*Math.sqrt((v.n/v.l)**2+(v.n/v.b)**2+(v.n/v.h)**2)}", "note": "Samme n anvendes i alle tre led, som angivet."}, {"name": "Sampling", "formula": "X = (Bit × kHz) / 1000", "fields": [{"k": "bit", "label": "Bit", "value": 24, "unit": ""}, {"k": "khz", "label": "Samplingsrate", "value": 48, "unit": "kHz"}], "calc": "{X:v.bit*v.khz/1000}", "note": ""}, {"name": "Summering i dB", "formula": "20 × log₁₀(Σ 10^(dBᵢ/20))", "fields": [{"k": "a", "label": "Højttaler 1", "value": 103, "unit": "dB"}, {"k": "b", "label": "Højttaler 2", "value": 98, "unit": "dB"}, {"k": "c", "label": "Højttaler 3", "value": 0, "unit": "dB"}, {"k": "d", "label": "Højttaler 4", "value": 0, "unit": "dB"}, {"k": "e", "label": "Højttaler 5", "value": 0, "unit": "dB"}, {"k": "g", "label": "Højttaler 6", "value": 0, "unit": "dB"}], "calc": "{dB:20*Math.log10([v.a,v.b,v.c,v.d,v.e,v.g].filter(x=>x!==0).reduce((s,x)=>s+10**(x/20),0))}", "note": "0 i højttalerfelter 3–6 betyder, at feltet udelades. Formlen følger billedet."}, {"name": "Fasedrej fra delaytid", "formula": "φ = (360 × f / 1000) × d", "fields": [{"k": "hz", "label": "Frekvens", "value": 1000, "unit": "Hz"}, {"k": "d", "label": "Delaytid", "value": 5, "unit": "ms"}], "calc": "{Grader:360*v.hz*v.d/1000}", "note": ""}, {"name": "Fasedrej fra afstand", "formula": "φ = (360 × f × Afstand) / C", "fields": [{"k": "hz", "label": "Frekvens", "value": 1000, "unit": "Hz"}, {"k": "d", "label": "Afstand", "value": 1, "unit": "m"}, {"k": "c", "label": "C", "value": 343, "unit": "m/s"}], "calc": "{Grader:360*v.hz*v.d/v.c}", "note": ""}, {"name": "Fasedrej til delaytid", "formula": "Delay = (φ / 360) × (1000 / f)", "fields": [{"k": "p", "label": "Fasedrej", "value": 50, "unit": "°"}, {"k": "hz", "label": "Frekvens", "value": 80, "unit": "Hz"}], "calc": "{ms:v.p/360*1000/v.hz}", "note": ""}, {"name": "Fasedrej – alternativ formel", "formula": "360 / (T × 1000) × d", "fields": [{"k": "t", "label": "T (frekvens)", "value": 100, "unit": "Hz"}, {"k": "d", "label": "d (tid)", "value": 5, "unit": "ms"}], "calc": "{Resultat:360/(v.t*1000)*v.d}", "note": "Formlen er bevaret nøjagtigt som indsendt. Den afviger fra den almindelige faseformel ovenfor og bør kontrolleres."}, {"name": "Frekvensafhængigt fasedelay", "formula": "Delay = ((FaseHF − FaseLF) / 360) / (fHF − fLF) × 1000", "fields": [{"k": "fl", "label": "Frekvens LF", "value": 70, "unit": "Hz"}, {"k": "pl", "label": "Fase LF", "value": 0, "unit": "°"}, {"k": "fh", "label": "Frekvens HF", "value": 1000, "unit": "Hz"}, {"k": "ph", "label": "Fase HF", "value": 360, "unit": "°"}, {"k": "r", "label": "Reference", "value": 360, "unit": "°"}], "calc": "{ms:((v.ph-v.pl)/v.r)/(v.fh-v.fl)*1000}", "note": ""}, {"name": "Frekvensuafhængigt fasedelay", "formula": "Delay = φ / (360 × f) × 1000", "fields": [{"k": "p", "label": "Fasedrejning", "value": 140, "unit": "°"}, {"k": "hz", "label": "Frekvens", "value": 125, "unit": "Hz"}, {"k": "r", "label": "Reference", "value": 360, "unit": "°"}], "calc": "{ms:v.p/(v.r*v.hz)*1000}", "note": ""}, {"name": "Nyquist Limit", "formula": "Nyquist = Samplingsrate / 2", "fields": [{"k": "hz", "label": "Samplingsrate", "value": 48000, "unit": "Hz"}, {"k": "r", "label": "Reference", "value": 2, "unit": ""}], "calc": "{Hz:v.hz/v.r}", "note": ""}, {"name": "FFT Delay", "formula": "Delay = Samples / Samplingsrate × 1000", "fields": [{"k": "s", "label": "Samplestørrelse", "value": 7350, "unit": ""}, {"k": "khz", "label": "Samplingsrate", "value": 44.1, "unit": "kHz"}], "calc": "{ms:v.s/v.khz}", "note": "Samplingsrate indtastes i kHz; dette giver delay direkte i ms."}, {"name": "Frekvensopløsning", "formula": "FR = (1 / Tidskonstant) × 1000", "fields": [{"k": "t", "label": "Tidskonstant", "value": 23, "unit": "ms"}, {"k": "r", "label": "Reference", "value": 1, "unit": ""}], "calc": "{Hz:v.r/v.t*1000}", "note": ""}, {"name": "Time Alignment", "formula": "Tid = (φ × 1000) / (360 × f)", "fields": [{"k": "p", "label": "Grad", "value": 180, "unit": "°"}, {"k": "hz", "label": "Frekvens", "value": 100, "unit": "Hz"}], "calc": "{ms:v.p*1000/(360*v.hz)}", "note": ""}, {"name": "SUB Array – afstand & delay", "formula": "Dₙ = Start + (n − 1) × B/4; Tₙ = (n − 1) × B/(4C) × 1000", "fields": [{"k": "c", "label": "Lydhastighed", "value": 343, "unit": "m/s"}, {"k": "b", "label": "Bølgelængde", "value": 4.9, "unit": "m"}, {"k": "start", "label": "SUB 1 fra center", "value": 2.14, "unit": "m"}, {"k": "n", "label": "Antal SUB", "value": 12, "unit": ""}], "calc": "{\"Trinafstand (m)\":v.b/4,\"Trindelay (ms)\":v.b/(4*v.c)*1000}", "note": "Tabellen viser placering og delay for hver SUB."}, {"name": "Retningsbestemthed SUB Array", "formula": "V = 2 × asin((0,61 × B)/(N × D))", "fields": [{"k": "b", "label": "Bølgelængde", "value": 4.9, "unit": "m"}, {"k": "r", "label": "Reference", "value": 0.61, "unit": ""}, {"k": "n", "label": "Antal SUB", "value": 4, "unit": ""}, {"k": "d", "label": "Afstand", "value": 1.5, "unit": "m"}], "calc": "{\"Fuld vinkel (°)\":2*Math.asin(v.r*v.b/(v.n*v.d))*180/Math.PI,\"Vinkel fra kant (°)\":Math.asin(v.r*v.b/(v.n*v.d))*180/Math.PI}", "note": ""}, {"name": "Cardioid SUB", "formula": "Afstand = C/(4f); Delay = 1000/(4f)", "fields": [{"k": "c", "label": "Lydhastighed", "value": 343, "unit": "m/s"}, {"k": "hz", "label": "Frekvens", "value": 45, "unit": "Hz"}], "calc": "{\"Afstand (m)\":v.c/(4*v.hz),\"Delay (ms)\":1000/(4*v.hz)}", "note": "Husk at fasevende den relevante SUB."}, {"name": "Endfire SUB", "formula": "Afstand = C/(4f); Delay = 1000/(4f)", "fields": [{"k": "hz", "label": "Frekvens", "value": 56, "unit": "Hz"}, {"k": "c", "label": "Lydhastighed", "value": 343, "unit": "m/s"}, {"k": "n", "label": "Antal SUB", "value": 5, "unit": ""}], "calc": "{\"Afstand pr. SUB (m)\":v.c/(4*v.hz),\"Delay pr. SUB (ms)\":1000/(4*v.hz)}", "note": "Tabellen viser afstand og delay fra SUB 1."}];
let selected=0;const values={};const $=id=>document.getElementById(id);const format=(x,d=2)=>Number(x).toLocaleString('da-DK',{minimumFractionDigits:d,maximumFractionDigits:d});
const parse=s=>Number(String(s).trim().replace(',','.'));const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderMenu(){const q=$('search').value.toLocaleLowerCase('da');$('menu').innerHTML='';calculators.forEach((it,i)=>{if(!it.name.toLocaleLowerCase('da').includes(q))return;const b=document.createElement('button');b.className='nav'+(i===selected?' active':'');b.textContent=String(i+1).padStart(2,'0')+'  '+it.name;b.onclick=()=>{selected=i;render();$('sidebar').classList.remove('open')};$('menu').appendChild(b)});if('info'.includes(q)){const b=document.createElement('button');b.className='nav'+(selected===-1?' active':'');b.textContent='ℹ  Info';b.onclick=()=>{selected=-1;render();$('sidebar').classList.remove('open')};$('menu').appendChild(b)}}
function render(){if(selected===-1){$('heading').textContent='Info';$('tag').textContent='Om appen';$('formula').textContent='Pro Audio Calculator';$('fields').innerHTML='';$('results').innerHTML='';$('extra').innerHTML='<div class="info-page"><p>Har du idéer til nye funktioner, forslag til forbedringer eller har du fundet en fejl i Pro Audio Calculator?</p><p>Så er du meget velkommen til at kontakte mig på mail.</p><a class="contact-link" href="mailto:Marcus.vraa0610@gmail.com?subject=Pro%20Audio%20Calculator%20-%20Feedback">✉ Kontakt mig</a><p class="info-email">Marcus.vraa0610@gmail.com</p><hr><p class="info-by">Udviklet af</p><h3>Marcus Vraa Madsen</h3><p>Pro Audio Calculator</p></div>';$('note').textContent='';renderMenu();return}const it=calculators[selected];$('heading').textContent=it.name;$('tag').textContent=`Beregner ${selected+1} af ${calculators.length}`;$('formula').textContent=selected===2?'dB = '+(values[2]?.factor||'20')+' × log₁₀(D₁ / D₂)':it.formula;$('fields').innerHTML='';if(selected===2){const box=document.createElement('div');box.className='field';const label=document.createElement('label');label.textContent='Vælg formel';const select=document.createElement('select');select.setAttribute('aria-label','Vælg formel');select.style.cssText='width:100%;padding:13px;background:#ffbf00;color:#19202b;border:2px solid #0b1018;border-radius:7px;font-size:17px;font-weight:700';select.innerHTML='<option value="20">20 × log (afstand)</option><option value="10">10 × log</option>';select.value=values[2]?.factor||'20';select.addEventListener('change',()=>{values[2].factor=select.value;$('formula').textContent='dB = '+select.value+' × log₁₀(D₁ / D₂)';calculate()});box.append(label,select);$('fields').appendChild(box)}if(!values[selected])values[selected]={};it.fields.forEach(field=>{const box=document.createElement('div');box.className='field';const label=document.createElement('label');label.textContent=field.label;const wrap=document.createElement('div');wrap.className='inp';const input=document.createElement('input');input.type='text';input.inputMode='decimal';input.setAttribute('aria-label',field.label);input.value=values[selected][field.k]??String(field.value).replace('.',',');input.addEventListener('input',()=>{values[selected][field.k]=input.value;calculate()});wrap.appendChild(input);if(field.unit){const unit=document.createElement('span');unit.className='unit';unit.textContent=field.unit;wrap.appendChild(unit)}box.append(label,wrap);$('fields').appendChild(box)});$('note').textContent=it.note||'';renderMenu();calculate()}
function calculate(){const it=calculators[selected];const v={};for(const f of it.fields){const val=values[selected][f.k]??String(f.value);if(String(val).trim()===''){showError('Udfyld alle felter.');return}v[f.k]=parse(val);if(!Number.isFinite(v[f.k])){showError('Indtast gyldige tal.');return}}
let out;try{out=selected===2?{dB:Number(values[2]?.factor||20)*Math.log10(v.a/v.b)}:Function('v','return ('+it.calc+')')(v)}catch(e){showError('Beregningen kunne ikke udføres.');return}if((selected===2&&(v.a<=0||v.b<=0))||(selected===3&&(v.l<=0||v.b<=0||v.h<=0||v.q<=0))||Object.values(out).some(x=>!Number.isFinite(x))){showError('Kan ikke beregne med disse værdier. Kontrollér bl.a. division med nul og vinkler.');return}
$('results').innerHTML=Object.entries(out).map(([name,value])=>`<div class="result"><small>${escapeHtml(name)}</small><strong>${format(value)}${name==='dB'?' dB':name==='Hz'?' Hz':name==='ms'||name==='Delay'&&selected===1?' ms':name==='Grader'?'°':name==='C'?' m/s':name==='Meter'||name==='Afstand'?' m':''}</strong></div>`).join('');$('extra').innerHTML='';if(selected===23||selected===26){const n=Math.min(30,Math.max(1,Math.round(v.n)));const d=selected===23?v.b/4:v.c/(4*v.hz),t=selected===23?v.b/(4*v.c)*1000:1000/(4*v.hz);let rows='';for(let i=0;i<n;i++){rows+=`<tr><td>SUB ${i+1}</td><td>${format((selected===23?v.start:0)+i*d,3)} m</td><td>${format(i*t)} ms</td></tr>`}$('extra').innerHTML=`<table class="data"><thead><tr><th>SUB</th><th>${selected===23?'Fra center':'Fra SUB 1'}</th><th>Delay</th></tr></thead><tbody>${rows}</tbody></table>`}}
function showError(message){$('results').innerHTML='<div class="error">'+escapeHtml(message)+'</div>';$('extra').innerHTML=''}
$('search').addEventListener('input',renderMenu);$('toggle').onclick=()=>$('sidebar').classList.toggle('open');render();
